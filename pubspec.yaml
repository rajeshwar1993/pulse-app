name: pulse_app
description: Pulse - Effortless peace of mind through mutual reassurance
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  
  # Routing
  go_router: ^14.0.0
  
  # Supabase
  supabase_flutter: ^2.5.0
  
  # Environment Variables
  flutter_dotenv: ^5.1.0
  
  # UI Utilities
  google_fonts: ^6.2.1
  
  # Localization
  flutter_localizations:
    sdk: flutter
  intl: any

  # Local Storage
  shared_preferences: ^2.2.3

  # Icons
  cupertino_icons: ^1.0.8

  # WebView
  webview_flutter: ^4.7.0

  # Deep Linking
  app_links: ^3.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  patrol: ^4.1.1
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9

patrol:
  app_name: Pulse
  android:
    package_name: com.pulse.pulse_app
  ios:
    bundle_id: com.pulse.pulseApp

flutter:
  generate: true
  uses-material-design: true
  
  assets:
    - .env
    - assets/images/
